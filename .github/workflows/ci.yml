name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: muslimmatrimony
          POSTGRES_PASSWORD: muslimmatrimony
          POSTGRES_DB: muslimmatrimony_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U muslimmatrimony"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MuslimMatrimony.sln
      - run: dotnet build MuslimMatrimony.sln -c Release --no-restore
      - run: dotnet test MuslimMatrimony.sln -c Release --no-build
        env:
          TEST_DATABASE_URL: Host=localhost;Port=5432;Database=muslimmatrimony_test;Username=muslimmatrimony;Password=muslimmatrimony
      - name: Check the migrations match the model
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project MuslimMatrimony.Web --no-build --configuration Release
        env:
          ConnectionStrings__MuslimMatrimony: Host=localhost;Port=5432;Database=muslimmatrimony_test;Username=muslimmatrimony;Password=muslimmatrimony
      - name: Fail on high/critical vulnerable packages
        run: |
          dotnet list MuslimMatrimony.sln package --vulnerable --include-transitive | tee vuln.txt
          if grep -Eq "(High|Critical)" vuln.txt; then exit 1; fi

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t muslimmatrimony-ci .
      - name: Smoke test image
        run: |
          docker network create mm
          docker run -d --name db --network mm -e POSTGRES_USER=mm -e POSTGRES_PASSWORD=mm -e POSTGRES_DB=mm postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U mm && break; sleep 1; done
          docker run -d --name app --network mm -p 8080:8080 --read-only --tmpfs /tmp \
            -e "ConnectionStrings__MuslimMatrimony=Host=db;Database=mm;Username=mm;Password=mm" \
            -e Security__HttpsOnly=false muslimmatrimony-ci
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "Nikah Noor"
          curl -fsS http://localhost:8080/Identity/Account/Register | grep -q "__RequestVerificationToken"
          docker logs app

  # CD part 1: every push (any branch, v* tags) publishes the image to GitHub Container Registry.
  #   ghcr.io/<owner>/muslimmatrimony:<branch>   e.g. claude-charming-noether-lhy664
  #   ghcr.io/<owner>/muslimmatrimony:sha-<7>    one per commit
  #   ghcr.io/<owner>/muslimmatrimony:latest     default branch only
  publish:
    if: github.event_name != 'pull_request'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/muslimmatrimony
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=muslimmatrimony
          cache-to: type=gha,mode=max,scope=muslimmatrimony

  # CD part 2 (optional): deploy to your own server through a self-hosted runner with the
  # label "local-server". Turn it on by setting the repository variable LOCAL_DEPLOY_BRANCH
  # to the branch that should auto-deploy. The server keeps its secrets in
  # $LOCAL_DEPLOY_DIR/.env (default ~/apps/muslimmatrimony), created once from deploy/.env.example.
  deploy-local:
    if: github.event_name == 'push' && vars.LOCAL_DEPLOY_BRANCH == github.ref_name
    needs: publish
    runs-on: [self-hosted, local-server]
    concurrency: deploy-local-muslimmatrimony
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        env:
          LOCAL_DEPLOY_DIR: ${{ vars.LOCAL_DEPLOY_DIR }}
        run: |
          DIR="${LOCAL_DEPLOY_DIR:-$HOME/apps/muslimmatrimony}"
          mkdir -p "$DIR"
          cp deploy/docker-compose.yml deploy/*.sh deploy/.env.example deploy/Caddyfile.example "$DIR/"
          if [ ! -f "$DIR/.env" ]; then
            echo "::error::Create $DIR/.env on the server (copy .env.example and fill in the secrets)"
            exit 1
          fi
          "$DIR/deploy.sh" "sha-${GITHUB_SHA::7}"
