# Runs the image published by CI (nothing is built on the server).
#   cp .env.example .env   # fill in the secrets
#   ./deploy.sh            # or: ./deploy.sh sha-1a2b3c4
name: muslimmatrimony

services:
  web:
    image: ghcr.io/onenetwork-tech/muslimmatrimony:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      ConnectionStrings__MuslimMatrimony: "Host=db;Database=${POSTGRES_DB:-muslimmatrimony};Username=${POSTGRES_USER:-muslimmatrimony};Password=${POSTGRES_PASSWORD}"
      Database__MigrateOnStartup: "true"
    ports: ["${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8083}:8080"]
    volumes:
      - data:/data          # photos + data-protection keys
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-muslimmatrimony}
      POSTGRES_USER: ${POSTGRES_USER:-muslimmatrimony}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  data:
